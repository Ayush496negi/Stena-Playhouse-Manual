<style>
:root{--orange:#FFA400;--orange-deep:#E58F00;--teal:#2A9488;--teal-dark:#1E6F66;--mint:#DFF2EF;--ink:#1F2A30;--muted:#5B6870;--paper:#fff;--gray:#F1F2F4;--line:#E3E6E8;color-scheme:light}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Lato',system-ui,sans-serif;color:var(--ink);background:var(--paper);line-height:1.5;min-height:100vh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0)}
.band{background:var(--orange);height:10px}
.wrap{width:100%;max-width:760px;margin:0 auto;padding:0 20px}
header{padding:24px 0 4px}
.logolink{display:inline-block;border-radius:8px}
.logo{width:150px;height:auto;display:block}
main{flex:1;padding-bottom:40px}
h1{font-size:clamp(2rem,7vw,3rem);line-height:1.1;font-weight:900;letter-spacing:-.02em;margin-top:28px}
.rule{width:96px;height:5px;background:var(--orange);border-radius:3px;margin:16px 0 18px}
.pill{display:inline-block;background:var(--mint);color:var(--teal);font-weight:700;padding:6px 16px;border-radius:999px;font-size:.95rem}
.lede{color:var(--muted);max-width:52ch;margin-top:14px}
.list{list-style:none;padding:0;margin-top:28px;display:grid;gap:12px}
.item{width:100%;display:flex;align-items:center;gap:16px;text-align:left;font:inherit;background:var(--gray);border:2px solid transparent;border-radius:18px;padding:18px 20px;cursor:pointer;color:var(--ink);transition:border-color .15s,background .15s,transform .1s}
.item:hover{border-color:var(--orange);background:#fff}
.item:active{transform:scale(.99)}
.item:focus-visible,.btn:focus-visible,.back:focus-visible,.logolink:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.code{flex:none;width:48px;height:48px;border-radius:14px;background:var(--orange);color:#fff;font-weight:900;display:grid;place-items:center;font-size:1.05rem}
.name{font-size:1.25rem;font-weight:700;line-height:1.2}
.sub{display:block;font-size:.9rem;color:var(--muted);font-weight:400}
.go{margin-left:auto;color:var(--teal);font-weight:700;font-size:.95rem;white-space:nowrap}
.item.suggest{background:var(--mint);border-color:var(--teal)}
.item[disabled]{cursor:default;opacity:.6}
.item[disabled]:hover{border-color:transparent;background:var(--gray)}
.item[disabled] .code{background:#B9C0C5}
.item[disabled] .go{color:var(--muted);font-weight:400}
section[hidden]{display:none}
.back{display:inline-flex;align-items:center;gap:8px;margin-top:24px;background:none;border:0;font:inherit;font-weight:700;color:var(--teal);cursor:pointer;padding:8px 0}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;font-weight:700;font-size:1.05rem;border-radius:14px;padding:16px 24px;min-height:54px;flex:1 1 220px;transition:background .15s}
.btn.primary{background:var(--orange);color:var(--ink)}
.btn.primary:hover{background:var(--orange-deep)}
.btn.ghost{background:var(--mint);color:var(--teal-dark)}
.btn.ghost:hover{background:#cfeae5}

/* PDF preview */
.preview{margin-top:24px;border:2px solid var(--line);border-radius:18px;overflow:hidden;background:var(--gray)}
.preview-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;font-size:.9rem;font-weight:700;color:var(--muted);border-bottom:1px solid var(--line);background:#fff}
.preview-bar a{color:var(--teal);text-decoration:none}
.preview-bar a:hover{text-decoration:underline}
.preview-body{padding:12px}
.preview object,.preview iframe{display:block;width:100%;height:min(78vh,720px);min-height:420px;border:0;border-radius:10px;background:#fff}
.preview .fallback{display:block;text-align:center}
.preview .fallback img{display:block;width:100%;max-width:520px;height:auto;margin:0 auto;border-radius:10px;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.preview .fallback span{display:inline-block;margin-top:12px;color:var(--teal);font-weight:700}

/* Picture cards (opening page) */
.cards{list-style:none;padding:0;margin-top:28px;display:grid;gap:18px;grid-template-columns:1fr;align-items:stretch}
@media (min-width:700px){.cards{grid-template-columns:repeat(3,1fr)}}
.card{height:100%;background:var(--gray);border:2px solid transparent;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s}
.card:hover{border-color:var(--orange)}
.card-pic{display:flex;align-items:center;justify-content:center;background:#fff;border:0;padding:14px;cursor:pointer;width:100%;height:210px;flex:none}
.card-pic img{width:100%;height:100%;object-fit:contain;display:block}
.card-pic:focus-visible{outline:3px solid var(--teal);outline-offset:-3px}
.card-body{padding:14px 16px 18px;display:flex;flex-direction:column;gap:12px;flex:1}
.card-name{font-size:1.1rem;font-weight:700;line-height:1.25;min-height:2.5em;display:flex;align-items:center}
.hint{margin-top:14px;color:var(--muted);font-size:.92rem}
.view-pic{margin-top:18px;background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px;text-align:center}
.view-pic img{max-width:100%;max-height:260px;object-fit:contain}
@media (min-width:820px){.wrap{max-width:900px}}

.notice{margin-top:28px;background:var(--gray);border-left:6px solid var(--orange);border-radius:14px;padding:16px 20px;font-size:.95rem}
.notice strong{display:block;margin-bottom:2px}
footer{border-top:1px solid var(--line);padding:22px 0 calc(22px + env(safe-area-inset-bottom,0));font-size:.92rem;color:var(--muted)}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px}
footer a{color:var(--teal);font-weight:700;text-decoration:none}
footer a:hover{text-decoration:underline}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

function prod(id){return PRODUCTS.filter(function(p){return p.id===id;})[0];}

function setLang(c){document.documentElement.lang=c;}
function suggested(p){
  var prefs=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language||"en"];
  for(var i=0;i<prefs.length;i++){var c=String(prefs[i]).slice(0,2).toLowerCase();if(p.ready[c])return c;}
  return null;
}
function row(code,title,go,cls,disabled,onclick){
  var li=document.createElement("li"),b=document.createElement("button");
  b.type="button";b.className="item"+(cls?" "+cls:"");
  b.innerHTML='<span class="code"></span><span class="name"></span><span class="go"></span>';
  b.querySelector(".code").textContent=code;
  b.querySelector(".name").textContent=title;
  b.querySelector(".go").textContent=go;
  if(disabled)b.disabled=true;else b.addEventListener("click",onclick);
  li.appendChild(b);return li;
}

/* Build the PDF preview: real PDF viewer where the browser supports it,

function buildPreview(p,c,t,f){
  var body=$("pv-body");body.innerHTML="";
  var obj=document.createElement("object");
  obj.type="application/pdf";
  obj.data=f+"#toolbar=0&navpanes=0&view=FitH";
  obj.setAttribute("aria-label",t.prev+" – "+p.names[c]);
  var fb=document.createElement("a");
  fb.className="fallback";fb.href=f;fb.target="_blank";fb.rel="noopener";
  var img=document.createElement("img");img.src=p.img;img.alt=p.names[c];
  var sp=document.createElement("span");sp.textContent=t.full;
  fb.appendChild(img);fb.appendChild(sp);
  obj.appendChild(fb);
  body.appendChild(obj);
}

    pic.setAttribute("aria-label",p.names.en);
    var im=document.createElement("img");im.src=p.img;im.alt=p.names.en;pic.appendChild(im);
    pic.addEventListener("click",function(){go(p.id);});
    var body=document.createElement("div");body.className="card-body";
    var nm=document.createElement("div");nm.className="card-name";nm.textContent=p.names.en;
    body.appendChild(nm);
    li.appendChild(pic);li.appendChild(body);ul.appendChild(li);
  });
  show("s-product");
}
function viewLangs(id){
  var p=prod(id);if(!p)return viewProducts();
  setLang("en");document.title="Stena – "+p.names.en;
  $("l-product").textContent=p.names.en;$("l-pic").src=p.img;$("l-pic").alt=p.names.en;
  var sug=suggested(p),ul=$("langs");ul.innerHTML="";
  LANGS.forEach(function(l){
    var ok=p.ready[l.code];
    ul.appendChild(row(l.code.toUpperCase(),l.label,ok?"View →":"Coming soon",l.code===sug?"suggest":"",!ok,function(){go(id,l.code);}));
  });
  show("s-lang");
}
function viewManual(id,c){
  var p=prod(id);
  if(!p||!p.ready[c])return viewLangs(id);
  var t=T[c],f=file(p,c);
  setLang(c);document.title="Stena – "+t.title+" – "+p.names[c];
  $("v-product").textContent=p.names[c];
  $("v-title").textContent=t.title;
  $("open").textContent=t.open;$("open").href=f;
  $("download").textContent=t.dl;$("download").href=f;
  $("download").setAttribute("download","stena-"+id+"-"+c+".pdf");
  $("back-lang").textContent="← "+t.back;
  $("pv-label").textContent=t.prev;
  $("pv-open").textContent=t.full;$("pv-open").href=f;
  $("safety").innerHTML="<strong></strong><span></span>";
  $("safety").firstChild.textContent=t.safe;$("safety").lastChild.textContent=t.txt;
  buildPreview(p,c,t,f);
  show("s-view");
}

/* Routing via #slide  or  #slide-en  (hash only: works from a QR code) */
function go(id,c){location.hash=c?id+"-"+c:id||"";}
function route(){
  var h=location.hash.replace("#","").split("-"),id=h[0],c=h[1];
  $("pv-body").innerHTML="";
  if(id&&c)viewManual(id,c);else if(id)viewLangs(id);else viewProducts();
}
window.addEventListener("hashchange",route);
$("back-product").addEventListener("click",function(){go();});
$("back-lang").addEventListener("click",function(){go(location.hash.replace("#","").split("-")[0]);});
$("logo").addEventListener("click",function(e){
  e.preventDefault();
  if(location.hash&&location.hash!=="#")location.hash="";else route();
});
route();
</script>
